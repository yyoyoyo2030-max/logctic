<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار AJAX Polling</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        
        .controls {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .controls h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #f56565;
            color: white;
        }
        
        .btn-danger:hover {
            background: #e53e3e;
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
        }
        
        .log {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        .log h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .log-content {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.8;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-time {
            color: #718096;
            margin-left: 10px;
        }
        
        .log-success {
            color: #48bb78;
        }
        
        .log-info {
            color: #4299e1;
        }
        
        .log-warning {
            color: #ed8936;
        }
        
        .log-error {
            color: #f56565;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        .stat-updated {
            animation: pulse 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 اختبار نظام AJAX Polling</h1>
            <p>اختبار التحديث اللحظي للبيانات</p>
        </div>
        
        <div class="stats-grid" data-realtime-dashboard>
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-value" data-stat="total-transfers">0</div>
                <div class="stat-label">إجمالي التحويلات</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">🚚</div>
                <div class="stat-value" data-stat="inprogress-transfers">0</div>
                <div class="stat-label">قيد التنفيذ</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" data-stat="completed-transfers">0</div>
                <div class="stat-label">مكتملة</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-value" data-stat="pending-transfers">0</div>
                <div class="stat-label">معلقة</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" data-stat="total-drivers">0</div>
                <div class="stat-label">السائقين</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-value" data-stat="total-tasks">0</div>
                <div class="stat-label">المهام</div>
            </div>
        </div>
        
        <div class="controls">
            <h2>التحكم في التحديثات</h2>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="startAll()">▶️ بدء الكل</button>
                <button class="btn btn-danger" onclick="stopAll()">⏹️ إيقاف الكل</button>
                <button class="btn btn-success" onclick="refreshStats()">🔄 تحديث فوري</button>
                <button class="btn btn-primary" onclick="testUpdate()">🧪 اختبار تحديث</button>
                <button class="btn btn-primary" onclick="clearLog()">🗑️ مسح السجل</button>
            </div>
        </div>
        
        <div class="log">
            <h2>📊 سجل الأحداث</h2>
            <div class="log-content" id="log"></div>
        </div>
    </div>
    
    <script>
        // تسجيل الأحداث
        function addLog(message, type = 'info') {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString('ar-SA');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            logEl.insertBefore(entry, logEl.firstChild);
            
            // الاحتفاظ بآخر 50 سجل فقط
            if (logEl.children.length > 50) {
                logEl.removeChild(logEl.lastChild);
            }
        }
        
        // Override console.log لعرض في الصفحة أيضاً
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.join(' ');
            if (message.includes('✅')) addLog(message, 'success');
            else if (message.includes('❌')) addLog(message, 'error');
            else if (message.includes('⏸️')) addLog(message, 'warning');
            else addLog(message, 'info');
        };
        
        // إنشاء poller عالمي للاختبار
        let testPoller;
        
        window.addEventListener('DOMContentLoaded', () => {
            addLog('🎯 تحميل صفحة الاختبار...', 'info');
            
            // إنشاء instance مخصص للاختبار
            testPoller = new RealtimePoller({
                statsInterval: 3000,
                notificationsInterval: 2000,
                
                onStatsUpdate: (stats) => {
                    addLog('📊 تم تحديث الإحصائيات', 'success');
                    console.log('البيانات:', stats);
                },
                
                onNotificationUpdate: (data) => {
                    if (data.notifications && data.notifications.length > 0) {
                        addLog(`🔔 ${data.notifications.length} إشعار جديد`, 'success');
                    }
                }
            });
            
            addLog('✅ نظام AJAX Polling جاهز للاختبار', 'success');
        });
        
        function startAll() {
            if (testPoller) {
                testPoller.startAll();
                addLog('▶️ تم بدء جميع خدمات التحديث', 'success');
            }
        }
        
        function stopAll() {
            if (testPoller) {
                testPoller.stopAll();
                addLog('⏹️ تم إيقاف جميع خدمات التحديث', 'warning');
            }
        }
        
        function refreshStats() {
            if (testPoller) {
                testPoller.refreshStats();
                addLog('🔄 تم طلب تحديث فوري', 'info');
            }
        }
        
        function testUpdate() {
            // محاكاة تحديث البيانات
            const stats = {
                total_transfers: Math.floor(Math.random() * 200) + 100,
                inprogress_transfers: Math.floor(Math.random() * 50),
                completed_transfers: Math.floor(Math.random() * 100),
                pending_transfers: Math.floor(Math.random() * 30),
                total_drivers: Math.floor(Math.random() * 50) + 20,
                total_tasks: Math.floor(Math.random() * 80)
            };
            
            // تحديث العناصر
            Object.keys(stats).forEach(key => {
                const el = document.querySelector(`[data-stat="${key}"]`);
                if (el) {
                    el.textContent = stats[key];
                    el.classList.add('stat-updated');
                    setTimeout(() => el.classList.remove('stat-updated'), 500);
                }
            });
            
            addLog('🧪 تم محاكاة تحديث البيانات', 'success');
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
            addLog('🗑️ تم مسح السجل', 'info');
        }
    </script>
    
    <!-- تضمين ملف polling.js الحقيقي -->
    <!-- ملاحظة: تأكد من المسار الصحيح -->
    <script src="assets/js/polling.js"></script>
</body>
</html>
